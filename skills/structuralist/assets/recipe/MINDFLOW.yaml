format: "2026-10-27"
adopted-release: "2026.10.27"

components:
  project:
    path: "."
    description: "The bounded unformalized project layer maintained by {{PROJECT_NAME}}."
  governance:
    path: "governance"
    description: "Documentation layers, change routing, admission, absorption, tightening, and completion."
  documentation_system:
    path: "governance/Documentation.md"
  profiles:
    path: "profiles"
    description: "Durable design authority and its governing aspects."
  profile_index:
    path: "profiles/README.md"
    index: true
  profile_product:
    path: "profiles/product.md"
  profile_architecture:
    path: "profiles/architecture.md"
  canonical:
    path: "canonical_docs"
    description: "Current implementation-facing contract and focused specifications."
  canonical_index:
    path: "canonical_docs/README.md"
    index: true
  canonical_system:
    path: "canonical_docs/system.md"
  deferred:
    path: "deferred_questions"
    description: "Live protected choices with safe boundaries and revisit evidence."
  deferred_index:
    path: "deferred_questions/README.md"
    index: true
  trim_guidance:
    path: "trim_manual"
    description: "Nonnormative reusable procedures for recurring documentation drift."
  trim_index:
    path: "trim_manual/README.md"
    index: true
  steering:
    path: "long_term_steering"
    description: "Current developing direction and its encompassing intent."
  steering_index:
    path: "long_term_steering/README.md"
    index: true
  steer_project:
    path: "long_term_steering/project-development.md"
  initial_direction:
    path: evolve/initial-direction.md

relationship-types:
  "is governed by":
    description: The target owns a rule or durable boundary the source must follow.
    direction: directional
  "tracks development of":
    description: The source carries active development whose durable result belongs in the target.
    direction: directional
  "shares an evolving boundary with":
    description: The two peer Structure components delimit a boundary whose coherence must remain explicit while either develops.
    direction: bidirectional

relationships:
  - source: "profiles"
    type: "is governed by"
    direction: "source-to-target"
    target: "governance"
  - source: "canonical"
    type: "is governed by"
    direction: "source-to-target"
    target: "governance"
  - source: "canonical"
    type: "is governed by"
    direction: "source-to-target"
    target: "profiles"
  - source: "deferred"
    type: "is governed by"
    direction: "source-to-target"
    target: "governance"
  - source: "trim_guidance"
    type: "is governed by"
    direction: "source-to-target"
    target: "governance"
  - source: "steering"
    type: "is governed by"
    direction: "source-to-target"
    target: "governance"
  - source: "steering"
    type: "tracks development of"
    direction: "source-to-target"
    target: "profiles"
  - source: "steering"
    type: "tracks development of"
    direction: "source-to-target"
    target: "canonical"
  - source: "profile_product"
    type: "shares an evolving boundary with"
    direction: "bidirectional"
    target: "profile_architecture"

anchor-connection-types:
  "retains historical context from":
    description: The current anchor document points to an exact historical file version held by its fixed Git boundary.

opening:
  files:
    - steer_project
    - profile_product
    - profile_architecture

evolve:
  events:
    - component: initial_direction
      opening:
        successors: [steer_project, profile_product, profile_architecture]
anchors: {}
